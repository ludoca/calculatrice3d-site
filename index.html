<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculatrice 3D</title>
<style>
:root { color-scheme: light dark; --encre: #14161a; --papier: #fbfbfd;
        --doux: #5b6270; --trait: #e3e5ea; --accent: #2d6cdf; }
@media (prefers-color-scheme: dark) {
  :root { --encre: #eceef2; --papier: #14161a; --doux: #9aa1ad;
          --trait: #2a2e36; --accent: #6ea2ff; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--papier); color: var(--encre);
       font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
       padding: 0 20px; }
main { max-width: 42rem; margin: 0 auto; padding: 48px 0 72px; }
h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 6px; letter-spacing: -0.02em; }
h2 { font-size: 1.25rem; margin: 48px 0 4px; padding-top: 24px;
     border-top: 1px solid var(--trait); letter-spacing: -0.01em; }
h2:first-of-type { border-top: 0; padding-top: 0; }
p, li { margin: 0 0 14px; }
ul { padding-left: 1.2em; }
code { font-size: 0.92em; background: color-mix(in srgb, var(--doux) 16%, transparent);
       padding: 1px 5px; border-radius: 5px; }
a { color: var(--accent); }
.chapeau { color: var(--doux); margin: 0 0 32px; }
nav { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 8px;
      font-size: 0.95rem; }
footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--trait);
         color: var(--doux); font-size: 0.9rem; }
footer a { color: inherit; }
</style>
<main>
  <h1>Calculatrice 3D</h1>
  <p class="chapeau">Traceur de surfaces à trois dimensions et calculatrice
  scientifique, pour Apple Vision Pro, iPhone, iPad et Mac.</p>
  <ul>
    <li><a href="confidentialite.html">Politique de confidentialité</a> —
        <span lang="en">Privacy Policy</span></li>
    <li><a href="assistance.html">Assistance</a> —
        <span lang="en">Support</span></li>
  </ul>
  <footer><a href="mailto:public@ludovic-cacheux.info">public@ludovic-cacheux.info</a></footer>
</main>
</html>
